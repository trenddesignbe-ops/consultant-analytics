</style>
<figure class="lab2" data-tool="spline-embed">
  <div class="lab-h"><h3>7 · Spline (scène 3D)</h3><button class="replay" type="button">Rejouer</button></div>
  <div class="stage-area">
    <canvas class="sp-canvas" aria-label="Scène 3D Spline"></canvas>
    <div class="mock">
      <svg viewBox="0 0 640 260" preserveAspectRatio="xMidYMid slice" aria-label="Capture statique : ruban de verre sur ciel pastel">

            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".45" stop-color="#CDB9FF" stop-opacity=".55"/><stop offset="1" stop-color="#BFDBFF" stop-opacity=".75"/>

          <linearGradient id="lab2SpGlass2" x1="0" y1="1" x2="1" y2="0">

        </defs>
        <g class="ribbon breathe">
          <path d="M-20,190 C120,60 260,300 400,150 S640,40 700,110" fill="none" stroke="#5B3FA0" stroke-opacity=".22" stroke-width="54" stroke-linecap="round" filter="url(#lab2SpShadow)" transform="translate(0,22)"/>
          <path d="M-20,190 C120,60 260,300 400,150 S640,40 700,110" fill="none" stroke="url(#lab2SpGlass)" stroke-width="54" stroke-linecap="round"/>
          <path d="M-20,190 C120,60 260,300 400,150 S640,40 700,110" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="3" stroke-linecap="round" transform="translate(0,-22)" filter="url(#lab2SpSoft)"/>
          <path d="M-20,190 C120,60 260,300 400,150 S640,40 700,110" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" transform="translate(0,-14)" filter="url(#lab2SpSoft)"/>
        </g>

          <path d="M-30,70 C110,140 250,-10 420,90 S620,230 700,180" fill="none" stroke="#5B3FA0" stroke-opacity=".16" stroke-width="30" stroke-linecap="round" filter="url(#lab2SpShadow)" transform="translate(0,16)"/>
          <path d="M-30,70 C110,140 250,-10 420,90 S620,230 700,180" fill="none" stroke="url(#lab2SpGlass2)" stroke-width="30" stroke-linecap="round"/>
          <path d="M-30,70 C110,140 250,-10 420,90 S620,230 700,180" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" transform="translate(0,-11)" filter="url(#lab2SpSoft)"/>
        </g>

      <div class="pill">100 € de pub = 4 ventes<small>à l'euro près, chaque lundi</small></div>

  <div class="lab-meta"><span>Poids<b>0 Ko sans scène, 540 Ko gzip avec</b></span><span>Lignes<b>≈ 100</b></span><span>Autonome<b>besoin d'Alexandre : exporter scene.splinecode</b></span></div>
  <p><b>Ce que montre la démo :</b> 100 € de pub = 4 ventes, à l'euro près, posé sur un décor de verre qui respire : le site respire la confiance avant même qu'on lise. <b>Ce que l'outil fait de spécial :</b> Spline permet de modeler une scène 3D (verre, lumière, matière, interactions souris) dans un éditeur visuel et de la jouer dans la page via son runtime, sans écrire de WebGL ; la carte charge le runtime uniquement si assets/scene.splinecode est présent, sinon elle affiche cette capture SVG. <b>Limite :</b> le runtime pèse 540 Ko gzip, n'existe qu'en module ESM (import dynamique), et une scène hébergée chez Spline (prod.spline.design) est bloquée par la CSP de l'artefact, d'où l'export local obligatoire.</p>
  <p class="howto"><b>À faire dans Spline :</b> ouvrir la scène, bouton Export (en haut à droite) → Code → onglet Vanilla JS → Download : le fichier scene.splinecode se télécharge ; le déposer dans assets/ sous ce nom exact. La carte le détecte, importe le runtime depuis unpkg et remplace la capture par la scène vivante. Vérifier dans Spline que la scène n'utilise ni police ni texture hébergée chez Spline (sinon elles seront bloquées par la CSP).</p>
  <div class="verdict">Verdict : réservé au décor du haut de page si Alexandre veut un vrai objet 3D signature, en acceptant 540 Ko ; pour tout le reste, une capture SVG comme celle ci fait illusion pour 3 Ko.</div>

<script>
(function(){
  var fig=document.querySelector('.lab2[data-tool="spline-embed"]');
  if(!fig)return;
  var mock=fig.querySelector('.mock'), canvas=fig.querySelector('.sp-canvas'), stateEl=fig.querySelector('.state');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var RUNTIME='https://unpkg.com/@splinetool/runtime@1.9.0/build/runtime.js';
  var SCENE='assets/scene.splinecode';
  var app=null;

  /* Pipeline Spline : le runtime n'existe qu'en ESM. On ne l'importe (import() dynamique, depuis unpkg) que si la scène
     exportée est présente à côté de la page. Sans scène, zéro octet chargé, la capture SVG tient lieu de décor. */
  function tryLoadScene(){
    if(location.protocol==='file:'){ stateEl.textContent='Capture statique : la scène Spline (.splinecode) est à exporter'; return; }
    var p; try{ p=fetch(SCENE,{method:'HEAD'}); }catch(e){ return; }
    p.then(function(r){ if(!r.ok) throw new Error('absent'); return import(RUNTIME); })
     .then(function(mod){
        app=new mod.Application(canvas);
        return app.load(SCENE);
     })
     .then(function(){ fig.classList.add('has-scene'); stateEl.textContent='Scène Spline chargée (runtime 540 Ko gzip)'; })
     .catch(function(e){ if(app){ stateEl.textContent='Scène trouvée mais le runtime n\'a pas pu la lire : capture statique'; } });
  }
  tryLoadScene();

  function play(){
    if(app){ try{ app.play(); }catch(e){} return; }
    mock.classList.remove('in');
    if(reduce){ mock.classList.add('in'); return; }
    void mock.offsetWidth;
    requestAnimationFrame(function(){ mock.classList.add('in'); });
  }
  fig.querySelector('.replay').addEventListener('click',play);
  window.LAB2=window.LAB2||{};
  window.LAB2["spline-embed"]={play:play};
})();
</script>
