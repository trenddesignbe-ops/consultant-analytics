<figure class="lab2" data-tool="codrops-grid">
  <div class="lab-h"><h3>4 · Démo Codrops « On-Scroll Layout Formations », grille 3D</h3><button class="replay" type="button">Rejouer</button></div>

      <div class="col a"><div class="lab">Google Ads dit<b>12</b></div><div class="grid" data-n="12"></div></div>
      <div class="col b"><div class="lab">Google Analytics dit<b>10</b></div><div class="grid" data-n="12" data-ghost="2"></div></div>
    </div>

  <div class="lab-meta"><span>Poids<b>27 Ko gzip</b></span><span>Lignes<b>≈ 50</b></span><span>Autonome<b>oui</b></span></div>
  <p><b>Ce que montre la démo :</b> les ventes du mois arrivent de loin et se rangent en deux piles, douze d'un côté, dix de l'autre, et les deux cases vides sautent aux yeux. <b>Ce que l'outil fait de spécial :</b> c'est la « formation » n° 4 de Codrops : chaque carte part d'une position 3D calculée selon sa distance au centre (translation, rotation X et Y, profondeur) et GSAP les fait converger avec un décalage en grille depuis le centre. L'original est piloté par le défilement, ici il est joué en 2,5 s. <b>Limite :</b> au delà d'une trentaine de cartes l'effet devient un nuage illisible, et la perspective CSS varie un peu d'un navigateur à l'autre.</p>
  <div class="verdict">Verdict : parfait pour la section « vos chiffres se contredisent », avec les vrais totaux du client, et nulle part ailleurs.</div>

  if(!window.gsap){ fig.classList.add('done'); window.LAB2['codrops-grid'] = { play: function(){} }; return; }
  // Codrops: calculateInitialTransform, elements further from the center start further away and more rotated
  function initial(el, offset, maxRot, maxZ){ var s = stage.getBoundingClientRect(), b = el.getBoundingClientRect(); var vc = { x: s.width/2, y: s.height/2 }; var ec = { x: b.left - s.left + b.width/2, y: b.top - s.top + b.height/2 }; var angle = Math.atan2(Math.abs(vc.y - ec.y), Math.abs(vc.x - ec.x)); var tx = Math.abs(Math.cos(angle) * offset), ty = Math.abs(Math.sin(angle) * offset); var maxD = Math.sqrt(vc.x*vc.x + vc.y*vc.y); var d = Math.sqrt(Math.pow(vc.x - ec.x, 2) + Math.pow(vc.y - ec.y, 2)); var f = d / maxD; return { x: ec.x < vc.x ? -tx : tx, y: ec.y < vc.y ? -ty : ty, z: maxZ * f, rotateX: (ec.y < vc.y ? -1 : 1) * (ty/offset) * maxRot * f, rotateY: (ec.x < vc.x ? 1 : -1) * (tx/offset) * maxRot * f }; }

    grids.forEach(function(g, gi){ var ts = Array.prototype.slice.call(g.children); tl.fromTo(ts, { x: function(_, el){ return initial(el, 260, 300, 900).x; }, y: function(_, el){ return initial(el, 260, 300, 900).y; }, z: function(_, el){ return initial(el, 260, 300, 900).z; }, rotateX: function(_, el){ return initial(el, 260, 300, 900).rotateX * .5; }, rotateY: function(_, el){ return initial(el, 260, 300, 900).rotateY; }, autoAlpha: 0, scale: .7 }, { x: 0, y: 0, z: 0, rotateX: 0, rotateY: 0, autoAlpha: 1, scale: 1, duration: 1.6, stagger: { amount: .55, from: 'center', grid: [4, 3] } }, .15 + gi * .35); });
