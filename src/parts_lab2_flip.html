<style>
.lab2[data-tool="flip"] .stage-area{background:linear-gradient(135deg,#EEF4FF 0%,#F3EEFF 40%,#FFEFF7 75%,#FFF3EC 100%)}
.lab2[data-tool="flip"] .board{position:absolute;inset:0;font-family:var(--body),sans-serif}
.lab2[data-tool="flip"] .ttl{position:absolute;left:22px;top:18px;font-family:var(--display),serif;font-size:22px;color:var(--ink);line-height:1.1}
.lab2[data-tool="flip"] .ttl .alt{position:absolute;left:0;top:0;white-space:nowrap;opacity:0}
.lab2[data-tool="flip"] .tiles{position:absolute;left:22px;right:22px;top:58px;bottom:20px}
.lab2[data-tool="flip"] .tile{position:absolute;background:#fff;border-radius:14px;padding:10px 14px 11px;box-shadow:0 12px 30px rgba(60,40,90,.14);width:150px;color:var(--ink);will-change:transform}
.lab2[data-tool="flip"] .tile .src{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px;white-space:nowrap}
.lab2[data-tool="flip"] .tile .val{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.lab2[data-tool="flip"] .tiles.clean{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;align-content:center}
.lab2[data-tool="flip"] .tiles.clean .tile{position:relative;width:auto;left:auto;top:auto;transform:none;padding:14px 16px 15px;box-shadow:0 14px 34px rgba(60,40,90,.12)}
.lab2[data-tool="flip"] .tiles.clean .tile .src{color:var(--ink-2);font-size:13px}
.lab2[data-tool="flip"] .tiles.clean .tile .val{font-size:24px;color:var(--accent)}
.lab2[data-tool="flip"] .tiles.clean .tile.gone{display:none}
</style>
<figure class="lab2" data-tool="flip">
  <div class="lab-h"><h3>5 · GSAP Flip</h3><button class="replay" type="button">Rejouer</button></div>
  <div class="stage-area">
    <div class="board" aria-label="Huit tuiles de chiffres éparpillées (Google Ads, Google Analytics, Shopify, Meta) se rangent en quatre tuiles : ventes, dépensé, rapporté, rendement.">
      <div class="ttl"><span class="main">Vos chiffres en désordre</span><span class="alt">Un seul chiffre par question</span></div>
      <div class="tiles">
        <div class="tile" data-keep="Ventes|12"><span class="src">Google Ads</span><span class="val">12 ventes</span></div>
        <div class="tile"><span class="src">Google Analytics</span><span class="val">10 ventes</span></div>
        <div class="tile" data-keep="Dépensé en pub|2&#8239;940&#8239;€"><span class="src">Google Ads</span><span class="val">2&#8239;300&#8239;€ dépensés</span></div>
        <div class="tile"><span class="src">Meta</span><span class="val">9 ventes</span></div>
        <div class="tile" data-keep="Rapporté|4&#8239;120&#8239;€"><span class="src">Shopify</span><span class="val">4&#8239;120&#8239;€ de CA</span></div>
        <div class="tile"><span class="src">Shopify</span><span class="val">11 ventes</span></div>
        <div class="tile"><span class="src">Meta</span><span class="val">640&#8239;€ dépensés</span></div>
        <div class="tile" data-keep="1&#8239;€ de pub rapporte|1,40&#8239;€"><span class="src">Google Analytics</span><span class="val">3&#8239;980&#8239;€ de CA</span></div>
      </div>
    </div>
  </div>
  <div class="lab-meta"><span>Poids<b>27 + 9 Ko gzip</b></span><span>Lignes<b>≈ 80</b></span><span>Autonome<b>oui</b></span></div>
  <p><b>Ce que montre la démo :</b> huit tuiles de chiffres qui se contredisent, éparpillées, se rangent d'elles mêmes en quatre tuiles, une par question : combien de ventes, combien dépensé, combien rapporté, ce que rapporte un euro de pub. <b>Ce que l'outil fait de spécial :</b> Flip photographie la position de chaque tuile, on change simplement la mise en page en CSS (une grille), et il anime la différence, tuiles qui disparaissent comprises, avec un décalage entre chacune. Aucune coordonnée calculée à la main, c'est la seule bibliothèque qui fait ça proprement. <b>Limite :</b> il faut que les éléments existent dans les deux états ; le contenu qui change de texte doit être fondu séparément.</p>
  <div class="verdict">Verdict : l'outil pour toute transition d'un état « avant » vers « après » sur de vrais éléments HTML, par exemple le bloc des trois outils qui s'alignent.</div>
</figure>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
<script>
(function(){
  var root = document.querySelector('.lab2[data-tool="flip"]');
  if (!root || !window.gsap || !window.Flip) return;
  gsap.registerPlugin(Flip);
  var stage = root.querySelector('.stage-area');
  var tilesBox = root.querySelector('.tiles');
  var ttlMain = root.querySelector('.ttl .main'), ttlAlt = root.querySelector('.ttl .alt');
  var initial = tilesBox.innerHTML;
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl = null;

  // Positions éparpillées, déterministes, adaptées à la largeur
  var SCATTER = [[0.02, 0.02, -7], [0.32, 0.62, 5], [0.56, 0.0, 8], [0.20, 0.28, -3], [0.74, 0.72, -6], [0.47, 0.34, 3], [0.04, 0.78, 6], [0.80, 0.22, -4]];

  function scatter(){
    var w = tilesBox.clientWidth, h = tilesBox.clientHeight;
    Array.prototype.forEach.call(tilesBox.children, function(t, i){
      var s = SCATTER[i];
      t.style.left = Math.round(s[0] * (w - 150)) + 'px';
      t.style.top = Math.round(s[1] * (h - 58)) + 'px';
      t.style.transform = 'rotate(' + s[2] + 'deg)';
    });
  }

  function tidy(){
    Array.prototype.forEach.call(tilesBox.children, function(t){
      var keep = t.getAttribute('data-keep');
      if (!keep) { t.classList.add('gone'); return; }
      var parts = keep.split('|');
      t.querySelector('.src').textContent = parts[0];
      t.querySelector('.val').textContent = parts[1];
      t.style.left = t.style.top = t.style.transform = '';
    });
    tilesBox.classList.add('clean');
  }

  function play(){
    if (tl) tl.kill();
    Flip.killFlipsOf(tilesBox.children);
    tilesBox.classList.remove('clean');
    tilesBox.innerHTML = initial;
    gsap.set([ttlMain, ttlAlt], { clearProps: 'all' });
    scatter();
    var tiles = Array.prototype.slice.call(tilesBox.children);

    if (RM) { tidy(); gsap.set(ttlMain, { opacity: 0 }); gsap.set(ttlAlt, { opacity: 1 }); return; }

    tl = gsap.timeline();
    tl.from(tiles, { scale: 0.7, opacity: 0, duration: 0.6, ease: 'back.out(1.6)', stagger: 0.07 }, 0.1)
      .from(ttlMain, { y: 10, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0)
      .add(function(){
        // 1. photographier l'état, 2. changer la mise en page, 3. laisser Flip animer la différence
        var state = Flip.getState(tiles);
        tidy();
        Flip.from(state, {
          duration: 1.1, ease: 'power3.inOut', absolute: true, scale: true, stagger: 0.07, nested: true,
          onLeave: function(els){ gsap.to(els, { opacity: 0, scale: 0.6, duration: 0.5, ease: 'power2.in', stagger: 0.05 }); }
        });
        gsap.fromTo(tilesBox.querySelectorAll('.tile:not(.gone) .src, .tile:not(.gone) .val'), { opacity: 0.25 }, { opacity: 1, duration: 0.8, delay: 0.5, ease: 'power2.out' });
      }, 1.6)
      .to(ttlMain, { opacity: 0, y: -8, duration: 0.4, ease: 'power2.in' }, 1.9)
      .fromTo(ttlAlt, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 2.3);
  }

  window.LAB2 = window.LAB2 || {};
  window.LAB2.flip = { play: play };
})();
</script>
