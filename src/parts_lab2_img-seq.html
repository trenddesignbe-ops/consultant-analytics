  var scroller=fig.querySelector('.scroller'), canvas=fig.querySelector('canvas'), ctx=canvas.getContext('2d');
  var idx=fig.querySelector('.idx'), bar=fig.querySelector('.bar i'), done=fig.querySelector('.done'), hint=fig.querySelector('.hint');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var imgs=FRAMES.map(function(u){ var im=new Image(); im.src=u; return im; });
  var current=-1, raf=null;

  function show(i){
    i=Math.max(0,Math.min(FRAMES.length-1,i));
    if(i===current)return; current=i;
    var im=imgs[i];
    var draw=function(){ ctx.clearRect(0,0,320,200); ctx.drawImage(im,0,0,320,200); };
    if(im.complete&&im.naturalWidth) draw(); else im.onload=draw;
    idx.textContent='image '+(i+1)+' / '+FRAMES.length;
    bar.style.transform='scaleX('+((i+1)/FRAMES.length)+')';
    done.classList.toggle('on',i>=FRAMES.length-4);
    hint.style.opacity=i>0?0:1;
  }
  function maxScroll(){ return scroller.scrollHeight-scroller.clientHeight; }
  function fromScroll(){ var m=maxScroll(); show(m>0?Math.round(scroller.scrollTop/m*(FRAMES.length-1)):0); }
  scroller.addEventListener('scroll',fromScroll,{passive:true});
  show(0);

  /* play() : auto-défilement doux de haut en bas (2,4 s, easing du site), puis repos. L'utilisateur garde la main avec la molette. */
  function play(){
    if(raf)cancelAnimationFrame(raf);
    var m=maxScroll();
    if(reduce){ scroller.scrollTop=m; show(FRAMES.length-1); return; }
    scroller.scrollTop=0; show(0);
    var t0=null, D=2400;
    function ease(t){ return 1-Math.pow(1-t,3); }
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/D);
      scroller.scrollTop=ease(p)*m;
      if(p<1) raf=requestAnimationFrame(step); else raf=null;
    }
    raf=requestAnimationFrame(step);
  }
  fig.querySelector('.replay').addEventListener('click',play);
  window.LAB2=window.LAB2||{};
  window.LAB2["img-seq"]={play:play};
})();
