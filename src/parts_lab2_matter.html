.lab2[data-tool="matter"] .stage-area{background:linear-gradient(160deg,#EEF4FF 0%,#F4F0FF 50%,#FFF0F7 100%)}
.lab2[data-tool="matter"] canvas{background:transparent}
</style>
<figure class="lab2" data-tool="matter">
  <div class="lab-h"><h3>6 · Matter.js</h3><button class="replay" type="button">Rejouer</button></div>
  <div class="stage-area"><canvas aria-label="Dix pièces tombent : six dans le bocal comptées, quatre rebondissent dans le bocal perdues. Un couvercle se ferme sur la fuite et les quatre suivantes tombent toutes dans comptées."></canvas></div>
  <div class="lab-meta"><span>Poids<b>25 Ko gzip</b></span><span>Lignes<b>≈ 170</b></span><span>Autonome<b>oui</b></span></div>
  <p><b>Ce que montre la démo :</b> dix ventes tombent, six finissent dans le bocal « comptées », quatre rebondissent dans « perdues » ; un couvercle se referme sur la fuite et les quatre suivantes tombent toutes au bon endroit. <b>Ce que l'outil fait de spécial :</b> rien n'est chorégraphié, les pièces ont une masse, un rebond et une friction, et le couvercle est une vraie trappe tenue par une charnière (contrainte) qui se referme sous son poids ; le rendu est un canvas dessiné à la main, pas le rendu fil de fer par défaut. <b>Limite :</b> une simulation n'est jamais exactement la même d'un navigateur à l'autre, il faut la contraindre pour garantir le résultat, et le texte reste du dessin, invisible aux lecteurs d'écran.</p>
  <div class="verdict">Verdict : pour une seule scène mémorable où la métaphore physique dit tout, jamais pour une donnée exacte.</div>
</figure>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(function(){
  var root = document.querySelector('.lab2[data-tool="matter"]');
  if (!root || !window.Matter) return;
  var M = Matter, Engine = M.Engine, Bodies = M.Bodies, Body = M.Body, Composite = M.Composite, Constraint = M.Constraint;
  var canvas = root.querySelector('canvas');
  var stage = root.querySelector('.stage-area');
  var ctx = canvas.getContext('2d');
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, S = null;
  var STEP = 1000 / 60, END = 330, LID_AT = 92;
  var WAVE1 = [12, 19, 26, 33, 40, 47, 54, 61, 68, 75], LOST = [2, 5, 7, 9], WAVE2 = [128, 142, 156, 170];
  var FS = ' ';

  function build(){
    var w = Math.max(360, stage.clientWidth), h = stage.clientHeight || 260, dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    var sx = w / 640;
    var engine = Engine.create({ gravity: { x: 0, y: 1.25 } });
    engine.timing.timeScale = 1;
    var floor = h - 22, jarTop = 118, divTop = 136, rightTop = 104;
    var xL = 0.10 * w, xD = 0.58 * w, xR = 0.84 * w, T = 10;
    var opts = { isStatic: true, friction: 0.4, restitution: 0.2, render: {} };
    var walls = [
      Bodies.rectangle(w / 2, floor + 30, w, 60, opts),
      Bodies.rectangle(xL, (jarTop + floor) / 2, T, floor - jarTop, M.Common.extend({ chamfer: { radius: 4 } }, opts)),
      Bodies.rectangle(xD, (divTop + floor) / 2, T, floor - divTop, M.Common.extend({ chamfer: { radius: 4 } }, opts)),
      Bodies.rectangle(xR, (rightTop + floor) / 2, T, floor - rightTop, M.Common.extend({ chamfer: { radius: 4 } }, opts)),
      Bodies.rectangle(-20, h / 2, 40, h * 2, opts), Bodies.rectangle(w + 20, h / 2, 40, h * 2, opts)
    ];
    // Couvercle : une trappe tenue par une charnière au sommet de la paroi droite
    var lidLen = (xR - xD) + 30, lidT = 9;
    var hinge = { x: xR, y: rightTop - 58 };
    var lid = Bodies.rectangle(hinge.x, hinge.y - lidLen / 2, lidT, lidLen, { friction: 0, frictionStatic: 0, restitution: 0, density: 0.004, frictionAir: 0.01, chamfer: { radius: 4 } });
    // Charnière (reste) + loquet (retiré au moment de fermer)
    var pin = Constraint.create({ pointA: hinge, bodyB: lid, pointB: { x: 0, y: lidLen / 2 }, length: 0, stiffness: 1 });
    var latch = Constraint.create({ pointA: { x: hinge.x - 10, y: hinge.y - lidLen }, bodyB: lid, pointB: { x: 0, y: -lidLen / 2 }, length: 0, stiffness: 1 });
    Composite.add(engine.world, walls.concat([lid, pin, latch]));
    return { engine: engine, w: w, h: h, dpr: dpr, sx: sx, floor: floor, jarTop: jarTop, divTop: divTop, rightTop: rightTop, xL: xL, xD: xD, xR: xR, lid: lid, latch: latch, lidLen: lidLen, lidT: lidT, hinge: hinge, coins: [], step: 0, counted: 0, lost: 0, lidOpen: true, done: false };
  }

  function spawn(s, lostPath){
    var r = Math.max(7, 9 * s.sx);
    var c = Bodies.circle(0.50 * s.w, 6, r, { restitution: 0.25, friction: 0.12, frictionStatic: 0.2, frictionAir: 0.01, density: 0.002 });
    Body.setVelocity(c, { x: (lostPath ? 3.0 : -1.3) * s.sx, y: 0 });
    c.plugin = { lostPath: lostPath, state: 'air', r: r };
    s.coins.push(c);
    Composite.add(s.engine.world, c);
  }

  function tick(s){
    var st = s.step;
    var i1 = WAVE1.indexOf(st); if (i1 >= 0) spawn(s, LOST.indexOf(i1) >= 0);
    if (WAVE2.indexOf(st) >= 0) spawn(s, true);
    if (st === LID_AT) { Composite.remove(s.engine.world, s.latch); Body.setAngularVelocity(s.lid, -0.1); }
    if (st > LID_AT && !s.lid.isStatic && s.lid.angle < -1.5 && Math.abs(s.lid.angularVelocity) < 0.004) { Body.setStatic(s.lid, true); s.lidOpen = false; }
    // Deux sous-pas par image : évite qu'une pièce rapide traverse une paroi
    Engine.update(s.engine, STEP / 2);
    Engine.update(s.engine, STEP / 2);
    s.coins.forEach(function(c){
      var p = c.plugin;
      if (p.state !== 'air') return;
      if (c.position.y > s.divTop + 12) {
        if (c.position.x < s.xD) { p.state = 'counted'; s.counted++; }
        else if (c.position.x < s.xR) { p.state = 'lost'; s.lost++; }
      }
    });
    s.step++;
    // Fin : toutes les pièces posées (ou garde fou)
    if (s.step > 200) {
      var settled = s.coins.length === WAVE1.length + WAVE2.length && s.coins.every(function(c){ return c.plugin.state !== 'air' && c.speed < 0.08; });
      if (settled || s.step >= END) s.done = true;
    }
  }

  function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function jar(x0, x1, top, fill, stroke){
    var r = 16;
    ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0, S.floor - r); ctx.arcTo(x0, S.floor, x0 + r, S.floor, r); ctx.lineTo(x1 - r, S.floor); ctx.arcTo(x1, S.floor, x1, S.floor - r, r); ctx.lineTo(x1, top);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.lineCap = 'round'; ctx.stroke();
  }

  function draw(s){
    ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    ctx.clearRect(0, 0, s.w, s.h);
    // Bocaux
    jar(s.xL, s.xD, s.jarTop, 'rgba(191,219,255,.42)', '#9FB9E6');
    jar(s.xD, s.xR, s.rightTop, 'rgba(255,215,196,.45)', '#E6B3A1');
    // Couvercle
    var l = s.lid;
    ctx.save(); ctx.translate(l.position.x, l.position.y); ctx.rotate(l.angle);
    roundRect(-s.lidT / 2, -s.lidLen / 2, s.lidT, s.lidLen, 4); ctx.fillStyle = '#55555C'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(s.hinge.x, s.hinge.y, 4.5, 0, Math.PI * 2); ctx.fillStyle = '#0B0B0C'; ctx.fill();
    // Pièces
    s.coins.forEach(function(c){
      var p = c.plugin, lost = p.state === 'lost';
      ctx.beginPath(); ctx.arc(c.position.x, c.position.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = lost ? '#FFD7C4' : '#2E5BFF'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = lost ? '#E5484D' : '#fff'; ctx.stroke();
      ctx.beginPath(); ctx.arc(c.position.x, c.position.y, p.r * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = lost ? 'rgba(229,72,77,.5)' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.2; ctx.stroke();
    });
    // Textes
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#0B0B0C'; ctx.font = '400 22px "Instrument Serif", serif'; ctx.textAlign = 'left';
    ctx.fillText(s.lidOpen ? 'Où fuient vos ventes ?' : 'Fuite fermée, tout est compté.', 20, 36);
    ctx.font = '600 28px Cabin, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#2E5BFF'; ctx.fillText(String(s.counted), (s.xL + s.xD) / 2, s.jarTop + 44);
    ctx.fillStyle = '#E5484D'; ctx.fillText(String(s.lost), (s.xD + s.xR) / 2, s.jarTop + 44);
    ctx.font = '500 13px Cabin, sans-serif'; ctx.fillStyle = '#55555C';
    ctx.fillText('comptées', (s.xL + s.xD) / 2, s.jarTop + 62);
    ctx.fillText('perdues', (s.xD + s.xR) / 2, s.jarTop + 62);
    ctx.font = '400 13px Cabin, sans-serif'; ctx.fillStyle = '#8A8A93'; ctx.textAlign = 'left';
    ctx.fillText('10 ventes, puis 4 de plus', 20, 58);
  }

  function loop(now){
    var s = S;
    if (!s) return;
    if (!s.last) s.last = now;
    var dt = Math.min(100, now - s.last); s.last = now; s.acc = (s.acc || 0) + dt;
    var n = 0;
    while (s.acc >= STEP && n < 4 && !s.done) { tick(s); s.acc -= STEP; n++; }
    draw(s);
    if (!s.done) raf = requestAnimationFrame(loop);
  }

  function play(){
    cancelAnimationFrame(raf);
    S = build();
    if (RM) { while (!S.done) tick(S); draw(S); return; }
    draw(S);
    raf = requestAnimationFrame(loop);
  }

  window.LAB2 = window.LAB2 || {};
  window.LAB2.matter = { play: play };
})();
</script>
