<figure class="lab2" data-tool="gltf-asset">
  <div class="lab-h"><h3>1 · Objet 3D tout fait (glTF CC0) dans Three.js</h3><button class="replay" type="button">Rejouer</button></div>
  <div class="stage-area">
    <canvas aria-hidden="true"></canvas>
    <div class="cap"><span class="l1">100 € de pub</span><span class="l2">= <output>0</output> ventes</span><span class="l3">à l'euro près, chaque commande comptée</span></div>
    <div class="credit">modèle « Present », Sara Vieira, CC0</div>
    <div class="nogl">Votre navigateur n'affiche pas la 3D : 100 € de pub = 4 ventes, à l'euro près.</div>
  </div>
  <div class="lab-meta"><span>Poids<b>145 Ko gzip + 66 Ko de modèle</b></span><span>Lignes<b>≈ 70</b></span><span>Autonome<b>oui</b></span></div>
  <p><b>Ce que montre la démo :</b> quatre commandes qui se posent une à une, une par vente, pendant que le chiffre monte de 0 à 4. <b>Ce que l'outil fait de spécial :</b> l'objet n'est pas dessiné en code, c'est un modèle libre de droits (CC0, pmndrs market) chargé une seule fois en glTF puis cloné, avec une vraie matière verre et un reflet d'environnement pastel. Le même pipeline accepte n'importe quel objet exporté de Blender ou de Spline. <b>Limite :</b> 145 Ko de bibliothèque plus le modèle, et rien n'est lisible par un lecteur d'écran sans le texte à côté.</p>
  <div class="verdict">Verdict : pour le hero uniquement, avec un objet qui parle au client (commande, colis, pièce), jamais dans un graphique.</div>
</figure>
